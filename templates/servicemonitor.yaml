apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "week20app.fullname" . }}
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      {{- include "week20app.selectorLabels" . | nindent 6 }}

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
